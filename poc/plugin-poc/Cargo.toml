[package]
name = "plugin-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "M18 proofs of concept for the plugin platform (S21): db:own limits, wasmtime limits, size impact"

# Standalone crate: not part of the main build, so the PoC never adds
# wasmtime to the shipped binary.
[workspace]

[features]
default = []
wasm = ["dep:wasmtime"]

[dependencies]
axum = "0.8"
tokio = { version = "1.52", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
libsqlite3-sys = { version = "0.30", default-features = false }
wasmtime = { version = "50", optional = true, default-features = false, features = ["runtime", "cranelift", "std"] }
wat = "1"
anyhow = "1"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
